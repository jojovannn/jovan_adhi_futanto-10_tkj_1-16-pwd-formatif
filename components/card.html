<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Lebar card jika tidak ada "box-sizing" = 363.56px -->
<style>

*{
    box-sizing: border-box;
}



body {
    margin: 0;
    font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
}

.card {
    width: 320px;
    padding: 20px;
    border: 2px solid black;
    margin: 30px auto;
    border-radius: 8px ;
    
}

.card img{
    width: 100%;
    height: 160px;
    display: block;
}

.card h3{
    margin-bottom: 8px;
}

.card p{
    font-size: 15px;
}

.card a {
    color: rgb(245, 225, 9);
}

a{
    color: rgb(190, 36, 204);
}

footer{
    text-align: center;
}



</style>
</head>
<body>
    
<main>
    <div class="card">
        <img src="/assets/images/pertamina.png" alt="">
        <h3>
           TUGAS LIPUTAN PERUSAHAAN 
        </h3>
        <p>
           Ini merupakan salah satu tugas proyek saya. Tugas ini menyuruh saya membuat seperti website tentang perusahaan yang saya liputi waktu itu, yaitu Pertamina.
            <a href="">Lihat Proyek</a>
        </p>
    </div>
</main>



<footer><a href="">Kembali ke beranda</a></footer>

</body>
</html>
