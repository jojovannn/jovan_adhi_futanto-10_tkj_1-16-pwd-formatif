<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      h2 {
        font-size: 20px;
        margin-left: 2%;
        color: #000000;
      }

      .btn {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bolder;
        text-decoration: solid;
        margin-top: 2%;
      }

      .button-group .btn {
        margin-right: 10px;
        margin-bottom: 10px;
        margin-top: 5%;
      }

      .btn-primary {
        background-color: rgb(20, 61, 134);
        color: azure;
      }

      .btn-secondary {
        background-color: rgba(100, 128, 173, 0.518);
        color: #000000;
      }

      .btn-outline {
        border: 2px solid black;
        color: #000000;
      }

      .btn-send {
        background-color: rgb(64, 211, 218);
        color: #f0ffff;
      }

      /* ===PEMBATAS==== */

      .btn-primary:hover {
        background-color: rgb(11, 34, 73);
        color: rgb(255, 255, 255);
      }

      .btn-secondary:hover {
        background-color: rgba(57, 74, 100, 0.518);
        color: #000000;
      }

      .btn-outline:hover {
        border: 2px solid black;
        color: #000000;
        background-color: rgba(121, 159, 197, 0.635);
      }

      .btn-send:hover {
        background-color: rgb(41, 135, 139);
        color: azure;
      }

      footer {
        margin-top: 5%;
      }


      footer a:active{
        font-weight: bolder;
        color: rgb(118, 13, 193);
      }

      /* kenapa a bukan footer? karena a itu 
      tag yang mengandung isi "Kembali ke beranda". footer hanya pembungkus */
      
      </style>
  </head>
  
  <body>
    <main>
      <div>
        <h2>Arahan</h2>

        <a class="btn btn-primary" href="">Lihat Proyek</a>

        <a class="btn btn-secondary" href="">Unduh CV</a>

        <a class="btn btn-outline" href="">Hubungi Saya</a>

        <a class="btn btn-send" href="">Kirim Pesan</a>
      </div>
    </main>
  </body>

  
  <footer><a href="">Kembali ke Beranda</a></footer>

  </html>
