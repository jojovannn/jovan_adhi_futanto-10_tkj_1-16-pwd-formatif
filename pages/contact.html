<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family:
          "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", "Lucida Sans",
          Arial, sans-serif;
      }

      .contact-form {
        width: 400px;
        padding: 24px;
        border: 1px solid black;
        margin: auto;
        border-radius: 8px;
      }

      #contact {
        padding: 40px 20px;
      }

      .contact-form h2 {
        text-align: center;
        color: rgb(0, 61, 130);
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        font-weight: bolder;
        margin-bottom: 6px;
      }

      .form-group input,
      .form-group textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        resize: none;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        background-color: rgba(11, 159, 238, 0.196);
      }

      .btn-submit {
        background-color: rgba(0, 133, 186, 0.973);
        color: white;
        border-radius: 5px;
        height: 30px;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
      }

      .btn-submit:hover {
        background-color: rgb(47, 103, 135);
      }

      footer {
        text-align: center;
      }

      footer a:active {
        color: blueviolet;
        font-weight: bolder;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <section id="contact">
      <form class="contact-form">
        <h2>Hubungi Saya</h2>

        <div class="form-group">
          <label for="nama" id="nama">Nama</label>
          <input type="text" />
        </div>

        <div class="form-group">
          <label for="email" id="nama">Email</label>
          <input type="email" name="email" id="email" />
        </div>

        <div class="form-group">
          <label for="pesan" id="pesan">Pesan</label>
          <textarea name="pesan" id="pesan"></textarea>
        </div>

        <button class="btn-submit">Kirim Pesan</button>
      </form>
    </section>
  </body>

  <footer><a href="">Kembali ke Beranda</a></footer>
</html>
